<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>SkyTrace — live flight map</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Open-source, non-commercial live flight tracker built on community ADS-B data."
    />
    <meta name="theme-color" content="#161826" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* App shell: painted straight from HTML while the JS loads (also the PWA splash). */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 80% at 30% 10%, #1b2033, #10121d 70%);
        color: #e9e9ed;
        font:
          500 44px/1.1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: -0.02em;
      }
      .boot-mark {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .boot-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #b5abfc;
        animation: boot-pulse 2.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dot {
          animation: none;
        }
      }
      @media (prefers-color-scheme: light) {
        .boot {
          background: radial-gradient(120% 80% at 30% 10%, #f4f5f9, #e3e5ee 70%);
          color: #1a1c26;
        }
        .boot-dot {
          background: #6f63ad;
        }
      }
    </style>
  </head>
  <body>
    <st-root>
      <div class="boot" aria-hidden="true">
        <div class="boot-mark"><span class="boot-dot"></span>SkyTrace</div>
      </div>
    </st-root>
    <noscript>SkyTrace needs JavaScript to draw the live map.</noscript>
  </body>
</html>
