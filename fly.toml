# Fly.io config for the SkyTrace backend. `fly launch --no-deploy` sets `app`.
app = "skytrace-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HISTORY_RETENTION_HOURS = "72"
  # Set to the Cloudflare Pages origin once it exists (ADR-010).
  CORS_ORIGIN = "*"

[http_service]
  internal_port = 8080
  force_https = true
  # The ingest worker must keep polling; never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[mounts]]
  source = "skytrace_history"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
